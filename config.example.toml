[morningstar]
base_url = "http://127.0.0.1:8080"
timeout_seconds = 5.0
# Retry connection-level failures so Sentinel tolerates an upstream startup race or brief restart.
connect_attempts = 5
retry_backoff_seconds = 0.25

[sentinel]
database_path = "./data/sentinel.db"
poll_interval_seconds = 15.0
monitor_enabled = true
stale_after_seconds = 45.0
residual_warning_w = 50.0
residual_warning_percent = 8.0
residual_critical_percent = 20.0
soc_warning_percent = 30.0
soc_critical_percent = 15.0

[forensics]
poll_interval_seconds = 300.0
window_days = 30
cache_seconds = 30.0
event_limit = 1000
history_missing_critical_days = 3
energy_discrepancy_warning_percent = 10.0
energy_discrepancy_critical_percent = 25.0
energy_min_integrated_seconds = 21600.0

[server]
host = "127.0.0.1"
port = 8090
