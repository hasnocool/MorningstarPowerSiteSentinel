[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "morningstar-powersite-sentinel"
version = "0.2.0"
description = "Local-first observability, diagnostics, and incident intelligence for Morningstar power systems."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "hasnocool"}]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
powersite-sentinel = "powersite_sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/powersite_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
